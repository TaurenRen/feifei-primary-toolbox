<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>狒狒的小学工具箱</title>
<style>
  :root{--ink:#12161c;--sub:#5c6675;--line:#e6e9ef;--brand:#1f5eff}
  *{box-sizing:border-box}
  body{margin:0;background:#f4f6fa;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    padding:48px 20px 64px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:820px;margin:0 auto}
  .kicker{font-size:12.5px;letter-spacing:.14em;color:var(--brand);font-weight:700}
  h1{font-size:34px;margin:10px 0 12px;letter-spacing:-.02em}
  .lede{font-size:15.5px;line-height:1.8;color:var(--sub);max-width:640px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:34px}
  a.card{display:block;background:#fff;border:1px solid var(--line);border-radius:16px;
    padding:20px;text-decoration:none;color:inherit;transition:.18s}
  a.card:hover{transform:translateY(-2px);box-shadow:0 10px 30px #1f2a3d14;border-color:#d5dbe6}
  .ico{width:38px;height:38px;border-radius:10px;background:var(--brand);color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;margin-bottom:12px}
  .card h3{margin:0 0 6px;font-size:17px}
  .card p{margin:0;font-size:13.5px;line-height:1.7;color:var(--sub)}
  .card .go{margin-top:12px;font-size:13px;color:var(--brand);font-weight:600}
  .soon{background:#fff;border:1px dashed #d7dde8;border-radius:16px;padding:20px;
    color:#9aa3b0;font-size:13.5px;line-height:1.7}
  footer{margin-top:40px;font-size:12.5px;color:#98a1ae;line-height:1.9}
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">F E I F E I · P R I M A R Y  T O O L B O X</div>
  <h1>狒狒的小学工具箱</h1>
  <p class="lede">给家长用的辅导小工具，一个工具解决一个小麻烦。全是单文件 HTML，不联网、不登录、双击就用。</p>

  <div class="grid">
    <a class="card" href="tools/dictation.html">
      <div class="ico">听</div>
      <h3>听写播报器</h3>
      <p>把课本词表粘进去，它按你设的间隔念给孩子听。每个词念两遍、自动倒数、写错了能当场补读。</p>
      <div class="go">打开工具 →</div>
    </a>
    <div class="soon">
      <b style="color:#6b7484">更多工具在路上</b><br>
      生字复习、口算计时、背诵填空、错题本……想到就往里放一个。
    </div>
  </div>

  <footer>
    开源地址：github.com/TaurenRen/feifei-primary-toolbox<br>
    MIT License · 随便用，注明来源就行
  </footer>
</div>
</body>
</html>
